name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (unit, e2e in Chromium, red-team, evaluation, PostgreSQL, contract)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: guardian
          POSTGRES_DB: guardian_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GUARDIAN_LLM_MODE: stub
      GUARDIAN_TEST_PG: postgresql://postgres:guardian@localhost:5432/guardian_test
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.5
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Test suite
        run: python -m pytest
      - name: Smart contract
        working-directory: chain
        run: forge test
